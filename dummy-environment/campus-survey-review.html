<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey review</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:15px}canvas{width:100%;height:60vh;border:1px solid #aaa;background:#f7faf8}label{display:block;margin:12px 0}pre{white-space:pre-wrap}</style></head><body><h1>Silverest survey review</h1><p>Select the raw export, processed walkways, processed access points and review.json. Files stay in this browser.</p><label>Review files <input id="files" type="file" multiple accept=".json,.geojson"></label><canvas id="map"></canvas><p>Orange: raw trace · Blue: processed path · Purple: access points · Gray: roads/buildings</p><pre id="report"></pre><script>
const $=id=>document.getElementById(id),c=$('map'); let context={};
Promise.all(['boundary','buildings','routing_graph'].map(n=>fetch(`/backend/data/campus/campus_${n}.json`).then(r=>r.json()))).then(([boundary,buildings,graph])=>{context={boundary,buildings,graph};draw({});});
function draw(files){if(!context.boundary)return;const ratio=devicePixelRatio||1;c.width=c.clientWidth*ratio;c.height=c.clientHeight*ratio;const g=c.getContext('2d');g.scale(ratio,ratio);const w=c.clientWidth,h=c.clientHeight,ring=context.boundary.geometry.coordinates[0];const xs=ring.map(p=>p[0]),ys=ring.map(p=>p[1]),scale=Math.min((w-30)/(Math.max(...xs)-Math.min(...xs)),(h-30)/(Math.max(...ys)-Math.min(...ys)));const xy=p=>[w/2+(p[0]-(Math.max(...xs)+Math.min(...xs))/2)*scale,h/2-(p[1]-(Math.max(...ys)+Math.min(...ys))/2)*scale];function line(points,color,width){if(!points?.length)return;g.beginPath();points.forEach((p,i)=>{const [x,y]=xy(p);i?g.lineTo(x,y):g.moveTo(x,y)});g.strokeStyle=color;g.lineWidth=width;g.stroke()}function dot(p,color){const [x,y]=xy(p);g.beginPath();g.arc(x,y,4,0,7);g.fillStyle=color;g.fill()}line(ring,'#266145',3);for(const b of context.buildings.buildings)if(b.geometry?.type==='Polygon')line(b.geometry.coordinates[0],'#aaa',1);const nodes=new Map(context.graph.nodes.map(n=>[n.id,n.coordinates]));for(const e of context.graph.edges)if(e.kind==='shared_road')line([nodes.get(e.from),nodes.get(e.to)],'#b7a278',1);for(const [name,pkg] of Object.entries(files)){if(name.startsWith('raw_'))for(const f of pkg.walkways?.features||[])line(f.geometry.coordinates,'#e67429',2);if(name==='processed_walkways.geojson')for(const f of pkg.features||[])line(f.geometry.coordinates,'#075cba',3);if(name==='processed_access_points.json')for(const a of pkg.access_points||[])dot([a.lng,a.lat],'#8335a0');}}
$('files').onchange=async e=>{const files={};for(const file of e.target.files)files[file.name]=JSON.parse(await file.text());$('report').textContent=JSON.stringify(files['review.json']||{},null,2);draw(files)};
</script></body></html>
