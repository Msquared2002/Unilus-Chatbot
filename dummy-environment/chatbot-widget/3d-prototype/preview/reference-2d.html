<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Original 2D reference</title><link rel="stylesheet" href="chatbot-widget/avatar.css"><style>html,body{margin:0;height:100%;background:transparent}body{display:flex;justify-content:center;align-items:center}#reference{transform:scale(1.4)}@media(max-width:400px){#reference{transform:scale(1.15)}}</style><div id="reference"></div><script src="chatbot-widget/avatar-hairstyles.js"></script><script src="chatbot-widget/avatar.js"></script><script>UniAvatar.init('#reference',{hairstyle:'low-afro',outfit:'black-spirit-hoodie'});addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent)return;const {hair,outfit,state}=event.data||{};if(hair!==undefined)UniAvatar.setHairstyle(hair==='low-afro'?hair:null);if(outfit!==undefined)UniAvatar.setOutfit(outfit==='black-spirit-hoodie'?outfit:'default');if(['idle','thinking','happy'].includes(state))UniAvatar.setState(state);});addEventListener('pagehide',()=>UniAvatar.destroy());</script>
