<!doctype html><title>Avatar fit verification</title><link rel="stylesheet" href="chatbot-widget/avatar.css"><style>body{font:16px system-ui}#stage{width:400px;height:330px;margin:20px;display:flex;justify-content:center;align-items:center;background:#fff}#avatar{transform:scale(1.7);transform-origin:center}button{padding:8px}</style><button onclick="UniAvatar.idle()">Idle</button><button onclick="UniAvatar.lookLeft()">Look left</button><button onclick="UniAvatar.lookRight()">Look right</button><button onclick="UniAvatar.setGlasses(null)">No glasses</button><output id="stats">Measuring floating movement...</output><div id="stage"><div id="avatar"></div></div><script src="chatbot-widget/avatar-hairstyles.js">const readings=[];setInterval(()=>{const b=document.querySelector('.uni-body').getBoundingClientRect();readings.push(b.y);if(readings.length>80)readings.shift();document.getElementById('stats').textContent='Measured vertical float: '+(Math.max(...readings)-Math.min(...readings)).toFixed(1)+'px; animation: '+getComputedStyle(document.querySelector('.uni-float')).animationName;},100);</script><script src="chatbot-widget/avatar.js">const readings=[];setInterval(()=>{const b=document.querySelector('.uni-body').getBoundingClientRect();readings.push(b.y);if(readings.length>80)readings.shift();document.getElementById('stats').textContent='Measured vertical float: '+(Math.max(...readings)-Math.min(...readings)).toFixed(1)+'px; animation: '+getComputedStyle(document.querySelector('.uni-float')).animationName;},100);</script><script>UniAvatar.init(avatar,{hairstyle:'bun',outfit:'white-nursing-uniform',glasses:'cateye-black'});const readings=[];setInterval(()=>{const b=document.querySelector('.uni-body').getBoundingClientRect();readings.push(b.y);if(readings.length>80)readings.shift();document.getElementById('stats').textContent='Measured vertical float: '+(Math.max(...readings)-Math.min(...readings)).toFixed(1)+'px; animation: '+getComputedStyle(document.querySelector('.uni-float')).animationName;},100);</script>
